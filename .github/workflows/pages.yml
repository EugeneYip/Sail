# Publish the static bundle to GitHub Pages.
#
# Enable once under Settings -> Pages -> Source: GitHub Actions. Nothing here
# needs a secret: the build fetches nothing and the deploy uses the repository's
# own OIDC token.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The GLSL lint runs here too: it catches a backtick-in-shader-comment
      # mistake that tsc reports as a cascade of errors far from the cause.
      - run: npm run typecheck
      # Refuses to publish a repo carrying scratch files, credentials, oversized
      # assets, or HTML missing what a crawler and a share preview need.
      - run: npm run preflight
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
